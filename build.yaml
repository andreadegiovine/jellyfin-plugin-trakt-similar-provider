overview: "Aggiunge 'Trakt' come fornitore nativo di elementi simili e suggerimenti, basato sul plugin Trakt ufficiale"
description: >
  Registra un fornitore "Trakt" selezionabile nelle impostazioni di libreria di Jellyfin 12
  (Fornitori di elementi simili), accanto a TheMovieDb e Local Genre/Tag, usando gli endpoint
  pubblici /movies|shows/{id}/related di Trakt.tv per film e serie. Aggiunge inoltre un
  fornitore di suggerimenti basato su /recommendations/movies e /recommendations/shows,
  personalizzati in base all'account Trakt collegato tramite il plugin ufficiale "Trakt"
  (da cui dipende). Nessuna libreria virtuale: ogni risultato viene verificato contro la
  libreria locale prima di essere mostrato.
category: "General"
owner: "self-hosted"
