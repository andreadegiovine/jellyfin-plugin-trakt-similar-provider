name: "Trakt Similar Provider"
guid: "a3f1c9d4-7e2b-4a6f-9c1d-5b8e2f0a6c3d"
version: "0.2.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Adds Trakt as a native provider of similar items and suggestions"
description: >
  Registers a "Trakt" provider that can be selected in the library settings of Jellyfin 12
  (Similar item providers), next to TheMovieDb and Local Genre/Tag, using the public
  /movies|shows/{id}/related endpoints of Trakt.tv for movies and shows. The same data also
  feeds the Suggestions tab ("Because you watched..." and "Because you liked..."). No Trakt
  account is required. No virtual library is created: every result is checked against the
  local library before being shown.
category: "General"
owner: "andreadegiovine"
artifacts:
- "Jellyfin.Plugin.TraktSimilarProvider.dll"
changelog: >
  0.2.0.0 - Suggestions now use /movies|shows/{id}/related for each watched or liked item
  instead of /recommendations, with one cache shared with Similar items. Removed the Trakt
  user selection and the dependency on the official Trakt plugin. Added a link to the
  configuration page in the dashboard sidebar. All labels and comments are now in English.

  0.1.0.0 - First version: "Trakt" provider for Similar items (movies/shows) via /related,
  Suggestions provider via /recommendations with the watchnow=favorites filter.
